                const response1 = await fetch('http://localhost:3005/api/admin/packages', {
                    method: 'GET',
                    headers: {
                        'Authorization': 'Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNubnJqbnBjbWRzZGx5bGR2dnBzIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc2NzU4ODUzOCwiZXhwIjoyMDgzMTY0NTM4fQ.fZviA_1KwAfuLxSAxgPcF6JQUVlzvyboVxSjlxrq2hc',

                    }

                const data1 = await response1.json();
                result.textContent += `响应: ${JSON.stringify(data1, null, 2)}\n\n`;

                // 测试2: 创建套餐
                result.textContent += '测试2: POST /api/admin/packages\n';
                const response2 = await fetch('http://localhost:3005/api/admin/packages', {
                    method: 'POST',
                    headers: {
                        'Authorization': 'Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNubnJqbnBjbWRzZGx5bGR2dnBzIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc2NzU4ODUzOCwiZXhwIjoyMDgzMTY0NTM4fQ.fZviA_1KwAfuLxSAxgPcF6JQUVlzvyboVxSjlxrq2hc',

                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        name: '简单测试套餐',
                        description: '测试',
                        validity_days: 30,
                        feature_permissions: ['match_game'],

            } catch (error) {

</html>
