<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>清空注册限制</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 50px auto;
      padding: 20px;
      background: #f5f5f5;
    }
    .card {
      background: white;
      border: 3px solid #000;
      border-radius: 12px;
      padding: 30px;
      box-shadow: 8px 8px 0 0 #000;
    }
    h1 {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 20px;
    }
    .input-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }
    input {
      width: 100%;
      padding: 12px;
      border: 2px solid #000;
      border-radius: 8px;
      font-size: 16px;
      box-sizing: border-box;
    }
    .button-group {
      display: flex;
      gap: 10px;
    }
    button {
      flex: 1;
      padding: 15px;
      color: white;
      border: 3px solid #000;
      border-radius: 8px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 4px 4px 0 0 #000;
    }
    #clearAll {
      background: #FF6B6B;
    }
    #clearAll:hover {
      background: #ff5252;
    }
    #clearIp {
      background: #4CAF50;
    }
    #clearIp:hover {
      background: #45a049;
    }
    button:hover {
      transform: translateY(2px);
      box-shadow: 2px 2px 0 0 #000;
    }
    button:active {
      transform: translateY(4px);
      box-shadow: none;
    }
    button:disabled {
      background: #ccc;
      cursor: not-allowed;
      transform: none;
      box-shadow: 4px 4px 0 0 #000;
    }
    .result {
      margin-top: 20px;
      padding: 15px;
      border-radius: 8px;
      display: none;
    }
    .result.success {
      background: #d4edda;
      border: 2px solid #c3e6cb;
      color: #155724;
    }
    .result.error {
      background: #f8d7da;
      border: 2px solid #f5c6cb;
      color: #721c24;
    }
    .info {
      background: #e7f3ff;
      border: 2px solid #b8daff;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🔓 清空注册限制</h1>

    <div class="info">
      <strong>说明：</strong><br>
      • 清空所有限制：删除所有IP的注册频率限制<br>
      • 清空指定IP：只删除特定IP的限制（需要知道用户的IP地址）
    </div>

    <div class="input-group">
      <label for="ipAddress">IP地址（可选，留空则清空所有）</label>
      <input type="text" id="ipAddress" placeholder="例如: 192.168.1.1">
    </div>

    <div class="button-group">
      <button id="clearAll" onclick="clearAll()">清空所有限制</button>
      <button id="clearIp" onclick="clearIp()">清空指定IP</button>
    </div>

    <div id="result" class="result"></div>
  </div>

  <script>
    async function clearAll() {
      await clearRateLimit({})
    }

    async function clearIp() {
      const ip = document.getElementById('ipAddress').value.trim()
      if (!ip) {
        showResult('error', '请输入IP地址')
        return
      }
      await clearRateLimit({ ipAddress: ip })
    }

    async function clearRateLimit(body) {
      const btn = event.target
      const resultDiv = document.getElementById('result')

      // Disable all buttons
      document.querySelectorAll('button').forEach(b => {
        b.disabled = true
      })
      btn.textContent = '正在清空...'

      resultDiv.style.display = 'none'

      try {
        const response = await fetch('/api/admin/clear-rate-limit', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(body)
        })

        const data = await response.json()

        resultDiv.style.display = 'block'
        resultDiv.className = 'result ' + (response.ok ? 'success' : 'error')

        if (response.ok) {
          resultDiv.innerHTML = `
            <strong>✅ ${data.message}</strong><br>
            <small>删除记录数: ${data.deletedCount}</small><br>
            <small>现在可以重新注册了</small>
          `
          btn.textContent = '✓ 完成'
          btn.style.background = '#B4F416'
        } else {
          resultDiv.innerHTML = `<strong>❌ 错误</strong><br>${data.error || data.details}`
          document.querySelectorAll('button').forEach(b => {
            b.disabled = false
          })
          btn.textContent = body.ipAddress ? '清空指定IP' : '清空所有限制'
        }
      } catch (error) {
        resultDiv.style.display = 'block'
        resultDiv.className = 'result error'
        resultDiv.innerHTML = `<strong>❌ 网络错误</strong><br>${error.message}`
        document.querySelectorAll('button').forEach(b => {
          b.disabled = false
        })
        btn.textContent = body.ipAddress ? '清空指定IP' : '清空所有限制'
      }
    }
  </script>
</body>
</html>
