<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>清空测试用户</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 50px auto;
      padding: 20px;
    }
    .card {
      background: white;
      border: 3px solid #000;
      border-radius: 12px;
      padding: 30px;
      box-shadow: 8px 8px 0 0 #000;
    }
    h1 {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 20px;
    }
    button {
      width: 100%;
      padding: 15px;
      background: #FF6B6B;
      color: white;
      border: 3px solid #000;
      border-radius: 8px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 4px 4px 0 0 #000;
    }
    button:hover {
      background: #ff5252;
      transform: translateY(2px);
      box-shadow: 2px 2px 0 0 #000;
    }
    button:active {
      transform: translateY(4px);
      box-shadow: none;
    }
    button:disabled {
      background: #ccc;
      cursor: not-allowed;
      transform: none;
      box-shadow: 4px 4px 0 0 #000;
    }
    .result {
      margin-top: 20px;
      padding: 15px;
      border-radius: 8px;
      display: none;
    }
    .result.success {
      background: #d4edda;
      border: 2px solid #c3e6cb;
      color: #155724;
    }
    .result.error {
      background: #f8d7da;
      border: 2px solid #f5c6cb;
      color: #721c24;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🗑️ 清空测试用户</h1>
    <p style="margin-bottom: 20px;">
      删除所有测试用户，保留你的管理员账号。清空后可以重新注册测试。
    </p>
    <button id="clearBtn" onclick="clearUsers()">清空所有测试用户</button>
    <div id="result" class="result"></div>
  </div>

  <script>
    async function clearUsers() {
      const btn = document.getElementById('clearBtn')
      const resultDiv = document.getElementById('result')

      btn.disabled = true
      btn.textContent = '正在删除...'
      resultDiv.style.display = 'none'

      try {
        const response = await fetch('/api/admin/clear-users', {
          method: 'DELETE'
        })

        const data = await response.json()

        resultDiv.style.display = 'block'
        resultDiv.className = 'result ' + (response.ok ? 'success' : 'error')

        if (response.ok) {
          resultDiv.innerHTML = `
            <strong>✅ ${data.message}</strong><br>
            <small>保留管理员: ${data.adminEmail}</small><br>
            <small>删除数量: ${data.deletedCount}</small>
          `
          btn.textContent = '✓ 清空完成'
          btn.style.background = '#B4F416'
        } else {
          resultDiv.innerHTML = `<strong>❌ 错误</strong><br>${data.error}`
          btn.disabled = false
          btn.textContent = '重试'
        }
      } catch (error) {
        resultDiv.style.display = 'block'
        resultDiv.className = 'result error'
        resultDiv.innerHTML = `<strong>❌ 网络错误</strong><br>${error.message}`
        btn.disabled = false
        btn.textContent = '重试'
      }
    }
  </script>
</body>
</html>
