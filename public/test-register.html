<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>测试注册</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 50px auto;
      padding: 20px;
      background: #f5f5f5;
    }
    .card {
      background: white;
      border: 3px solid #000;
      border-radius: 12px;
      padding: 30px;
      box-shadow: 8px 8px 0 0 #000;
    }
    h1 {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 20px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      font-weight: bold;
      margin-bottom: 5px;
    }
    input {
      width: 100%;
      padding: 10px;
      border: 2px solid #000;
      border-radius: 8px;
      font-size: 16px;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 15px;
      background: #4CAF50;
      color: white;
      border: 3px solid #000;
      border-radius: 8px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }
    button:hover {
      background: #45a049;
    }
    button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    .result {
      margin-top: 20px;
      padding: 15px;
      border-radius: 8px;
      white-space: pre-wrap;
      font-family: monospace;
      font-size: 14px;
      max-height: 500px;
      overflow-y: auto;
    }
    .result.success {
      background: #d4edda;
      border: 2px solid #c3e6cb;
      color: #155724;
    }
    .result.error {
      background: #f8d7da;
      border: 2px solid #f5c6cb;
      color: #721c24;
    }
    .info {
      background: #e7f3ff;
      border: 2px solid #b8daff;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1🔍 测试注册诊断</h1>

    <div class="info">
      <strong>说明：</strong>这个工具会详细显示每一步的执行过程，帮助诊断注册失败的原因。
    </div>

    <div class="form-group">
      <label>手机号</label>
      <input type="text" id="phone" value="19521529803" placeholder="11位手机号">
    </div>

    <div class="form-group">
      <label>密码</label>
      <input type="password" id="password" value="test123456" placeholder="至少6位">
    </div>

    <div class="form-group">
      <label>邀请码</label>
      <input type="text" id="invitationCode" value="TEST1234" placeholder="邀请码">
    </div>

    <div style="display: flex; gap: 10px; margin-top: 10px;">
      <button id="testBtn" onclick="testRegister()" style="flex: 1; background: #4CAF50;">普通注册测试</button>
      <button id="forceBtn" onclick="forceCreateUser()" style="flex: 1; background: #FF6B6B;">强制创建用户</button>
    </div>

    <div id="result" class="result" style="display: none;"></div>
  </div>

  <script>
    async function testRegister() {
      const btn = document.getElementById('testBtn')
      const resultDiv = document.getElementById('result')

      const phone = document.getElementById('phone').value
      const password = document.getElementById('password').value
      const invitationCode = document.getElementById('invitationCode').value

      btn.disabled = true
      btn.textContent = '测试中...'
      resultDiv.style.display = 'none'

      try {
        const response = await fetch('/api/admin/test-register', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ phone, password, invitationCode })
        })

        const data = await response.json()

        resultDiv.style.display = 'block'
        resultDiv.className = 'result ' + (response.ok ? 'success' : 'error')

        if (data.success) {
          resultDiv.textContent = `✅ ${data.message}\n\n详细日志:\n${data.logs.join('\n')}`
          btn.textContent = '✓ 测试成功'
          btn.style.background = '#B4F416'
        } else {
          resultDiv.textContent = `❌ ${data.error}\n\n详细日志:\n${data.logs.join('\n')}`
          btn.disabled = false
          btn.textContent = '重新测试'
        }
      } catch (error) {
        resultDiv.style.display = 'block'
        resultDiv.className = 'result error'
        resultDiv.textContent = `❌ 网络错误\n\n${error.message}`
        btn.disabled = false
        btn.textContent = '重新测试'
      }
    }

    async function forceCreateUser() {
      const btn = document.getElementById('forceBtn')
      const resultDiv = document.getElementById('result')

      const phone = document.getElementById('phone').value
      const password = document.getElementById('password').value
      const invitationCode = document.getElementById('invitationCode').value

      btn.disabled = true
      btn.textContent = '创建中...'
      resultDiv.style.display = 'none'

      try {
        const response = await fetch('/api/admin/force-create-user', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ phone, password, invitationCode })
        })

        const data = await response.json()

        resultDiv.style.display = 'block'
        resultDiv.className = 'result ' + (response.ok ? 'success' : 'error')

        if (data.success) {
          resultDiv.textContent = `✅ ${data.message}\n\n详细日志:\n${data.logs.join('\n')}`
          btn.textContent = '✓ 创建成功'
          btn.style.background = '#B4F416'
        } else {
          resultDiv.textContent = `❌ ${data.error}\n\n详细日志:\n${data.logs.join('\n')}`
          btn.disabled = false
          btn.textContent = '重试'
        }
      } catch (error) {
        resultDiv.style.display = 'block'
        resultDiv.className = 'result error'
        resultDiv.textContent = `❌ 网络错误\n\n${error.message}`
        btn.disabled = false
        btn.textContent = '重试'
      }
    }
  </script>
</body>
</html>
