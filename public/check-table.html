<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>检查 users 表结构</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 900px;
      margin: 50px auto;
      padding: 20px;
      background: #f5f5f5;
    }
    .card {
      background: white;
      border: 3px solid #000;
      border-radius: 12px;
      padding: 30px;
      box-shadow: 8px 8px 0 0 #000;
    }
    h1 {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 20px;
    }
    button {
      width: 100%;
      padding: 15px;
      background: #4CAF50;
      color: white;
      border: 3px solid #000;
      border-radius: 8px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover {
      background: #45a049;
    }
    .result {
      margin-top: 20px;
      padding: 15px;
      background: #f0f0f0;
      border-radius: 8px;
      font-family: monospace;
      font-size: 13px;
      white-space: pre-wrap;
    }
    .column {
      padding: 8px;
      margin: 5px 0;
      border-radius: 4px;
    }
    .has-updated-at {
      background: #d4edda;
      color: #155724;
    }
    .missing-updated-at {
      background: #f8d7da;
      color: #721c24;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1🔍 检查 users 表结构</h1>
    <button onclick="checkTable()">检查表结构</button>
    <div id="result" style="display: none;"></div>
  </div>

  <script>
    async function checkTable() {
      const btn = document.querySelector('button')
      const resultDiv = document.getElementById('result')

      btn.disabled = true
      btn.textContent = '检查中...'
      resultDiv.style.display = 'none'

      try {
        // 查询一个用户来获取列信息
        const response = await fetch('/api/words?bookId=003b4ce0-c3f9-407a-a7d6-5e80ada4eae5&status=all&page=1&pageSize=1')

        if (response.ok) {
          // 这个请求成功说明数据库连接正常
          resultDiv.style.display = 'block'
          resultDiv.innerHTML = '<strong>数据库连接正常</strong><br><br>请检查 Supabase Dashboard 中 users 表的结构：<br><br>1. 打开 https://supabase.com/dashboard<br>2. 选择项目<br>3. 点击 Table Editor<br>4. 找到 users 表<br>5. 查看是否有 updated_at 列'
        } else {
          throw new Error('数据库连接失败')
        }
      } catch (error) {
        resultDiv.style.display = 'block'
        resultDiv.innerHTML = `<strong>错误：</strong>${error.message}`
      }

      btn.disabled = false
      btn.textContent = '检查表结构'
    }
  </script>
</body>
</html>
