<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>单词API测试</title>
  <style>
    body {
      font-family: monospace;
      padding: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }
    .section {
      margin: 20px 0;
      padding: 15px;
      border: 2px solid #ccc;
      border-radius: 8px;
    }
    .error {
      color: red;
    }
    .success {
      color: green;
    }
    button {
      padding: 10px 20px;
      margin: 5px;
      cursor: pointer;
      background: #0070f3;
      color: white;
      border: none;
      border-radius: 4px;
    }
    button:hover {
      background: #0051cc;
    }
    pre {
      background: #f5f5f5;
      padding: 10px;
      border-radius: 4px;
      overflow-x: auto;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 10px;
    }
    .stat-card {
      padding: 15px;
      border: 2px solid #ddd;
      border-radius: 8px;
      text-align: center;
    }
    .stat-number {
      font-size: 32px;
      font-weight: bold;
      margin: 10px 0;
    }
  </style>
</head>
<body>
  <h1>🔍 单词API诊断工具</h1>

  <div class="section">
    <h2>步骤1: 获取书籍列表</h2>
    <button onclick="testFetchBooks()">获取书籍</button>
    <div id="books-result"></div>
  </div>

  <div class="section">
    <h2>步骤2: 测试单词API</h2>
    <button onclick="testWordsAll()">测试 status=all</button>
    <button onclick="testWordsUnknown()">测试 status=unknown</button>
    <button onclick="testWordsFuzzy()">测试 status=fuzzy</button>
    <button onclick="testWordsKnown()">测试 status=known</button>
    <button onclick="testWordsNew()">测试 status=new</button>
    <div id="words-result"></div>
  </div>

  <div class="section">
    <h2>步骤3: 检查进度数据</h2>
    <button onclick="testWordProgress()">获取单词进度</button>
    <div id="progress-result"></div>
  </div>

  <script>
    let currentBookId = null;

    async function testFetchBooks() {
      const resultDiv = document.getElementById('books-result');
      resultDiv.innerHTML = '<p>加载中...</p>';

      try {
        const res = await fetch('/api/books');
        const data = await res.json();

        if (data.success && data.data.length > 0) {
          currentBookId = data.data[0].id;
          resultDiv.innerHTML = `
            <p class="success">✅ 找到 ${data.data.length} 本书</p>
            <p><strong>当前测试书籍:</strong> ${data.data[0].title} (${currentBookId})</p>
            <pre>${JSON.stringify(data.data.slice(0, 5), null, 2)}</pre>
          `;
        } else {
          resultDiv.innerHTML = '<p class="error">❌ 没有找到任何书籍</p>';
        }
      } catch (error) {
        resultDiv.innerHTML = `<p class="error">❌ 错误: ${error.message}</p>`;
      }
    }

    async function testWords(status) {
      if (!currentBookId) {
        alert('请先获取书籍列表！');
        return;
      }

      const resultDiv = document.getElementById('words-result');
      resultDiv.innerHTML = '<p>加载中...</p>';

      try {
        const url = `/api/words?bookId=${currentBookId}&status=${status}`;
        console.log('📡 请求URL:', url);

        const res = await fetch(url);
        const data = await res.json();

        console.log('📊 响应数据:', data);

        if (data.success !== undefined) {
          const count = data.total || 0;
          const words = data.data || [];

          resultDiv.innerHTML = `
            <p class="${count > 0 ? 'success' : 'error'}">
              ${count > 0 ? '✅' : '❌'} status=<strong>${status}</strong>: ${count} 个单词
            </p>
            <div class="stat-card">
              <div class="stat-number">${count}</div>
              <div>单词数量</div>
            </div>
            ${words.length > 0 ? `
              <h3>前5个单词:</h3>
              <pre>${JSON.stringify(words.slice(0, 5), null, 2)}</pre>
            ` : '<p class="error">⚠️ 没有单词数据</p>'}
          `;
        } else {
          resultDiv.innerHTML = `<p class="error">❌ API错误: ${JSON.stringify(data)}</p>`;
        }
      } catch (error) {
        resultDiv.innerHTML = `<p class="error">❌ 错误: ${error.message}</p>`;
        console.error('完整错误:', error);
      }
    }

    function testWordsAll() { testWords('all'); }
    function testWordsUnknown() { testWords('unknown'); }
    function testWordsFuzzy() { testWords('fuzzy'); }
    function testWordsKnown() { testWords('known'); }
    function testWordsNew() { testWords('new'); }

    async function testWordProgress() {
      if (!currentBookId) {
        alert('请先获取书籍列表！');
        return;
      }

      const resultDiv = document.getElementById('progress-result');
      resultDiv.innerHTML = '<p>加载中...</p>';

      try {
        const url = `/api/word-progress?book_id=${currentBookId}`;
        const res = await fetch(url);
        const data = await res.json();

        const progressData = data.data || {};
        const counts = {
          total: Object.keys(progressData).length,
          known: 0,
          fuzzy: 0,
          unknown: 0
        };

        Object.values(progressData).forEach(p => {
          if (counts[p.status] !== undefined) {
            counts[p.status]++;
          }
        });

        resultDiv.innerHTML = `
          <p class="success">✅ 找到进度数据</p>
          <div class="grid">
            <div class="stat-card">
              <div class="stat-number">${counts.total}</div>
              <div>总进度记录</div>
            </div>
            <div class="stat-card" style="border-color: #B4F416;">
              <div class="stat-number">${counts.known}</div>
              <div>认识</div>
            </div>
            <div class="stat-card" style="border-color: #FACC15;">
              <div class="stat-number">${counts.fuzzy}</div>
              <div>模糊</div>
            </div>
            <div class="stat-card" style="border-color: #FF6B6B;">
              <div class="stat-number">${counts.unknown}</div>
              <div>不认识</div>
            </div>
          </div>
          <details>
            <summary>查看完整数据</summary>
            <pre>${JSON.stringify(progressData, null, 2)}</pre>
          </details>
        `;
      } catch (error) {
        resultDiv.innerHTML = `<p class="error">❌ 错误: ${error.message}</p>`;
      }
    }
  </script>
</body>
</html>
