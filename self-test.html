<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>词库管理功能自测 v2</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        .header h1 { font-size: 32px; margin-bottom: 10px; }
        .content { padding: 30px; }
        .config {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .form-group { margin-bottom: 15px; }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #555;
        }
        .form-group input {
            width: 100%;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
        }
        .form-group small {
            display: block;
            margin-top: 5px;
            color: #888;
            font-size: 12px;
        }
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-right: 10px;
        }
        .btn:hover { opacity: 0.9; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-stop {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }
        .progress {
            background: #e0e0e0;
            height: 30px;
            border-radius: 15px;
            overflow: hidden;
            margin: 20px 0;
        }
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            transition: width 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
        }
        .test-item {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
            border-left: 4px solid #ddd;
        }
        .test-item.pass {
            background: #d4edda;
            border-left-color: #28a745;
        }
        .test-item.fail {
            background: #f8d7da;
            border-left-color: #dc3545;
        }
        .test-item h4 {
            margin-bottom: 8px;
            color: #333;
        }
        .status {
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
        }
        .test-item.pass .status {
            background: #28a745;
            color: white;
        }
        .test-item.fail .status {
            background: #dc3545;
            color: white;
        }
        .summary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            margin-top: 20px;
            display: none;
        }
        .summary.show { display: block; }
        .summary .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 15px;
        }
        .summary .stat {
            background: rgba(255, 255, 255, 0.2);
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }
        .summary .stat .number { font-size: 32px; font-weight: 700; }
        .summary .stat .label { font-size: 14px; opacity: 0.9; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔍 词库管理功能自测 v2</h1>
            <p>自动测试所有修复的功能</p>
        </div>

        <div class="content">
            <div class="config">
                <h3>⚙️ 测试配置</h3>
                <div class="form-group">
                    <label>本地服务器地址</label>
                    <input type="text" id="baseUrl" value="http://localhost:3000" placeholder="http://localhost:3000">
                    <small>确保开发服务器正在运行</small>
                </div>
                <div class="form-group">
                    <label>测试用单词书ID（可选）</label>
                    <input type="text" id="testBookId" placeholder="留空自动查找第一个">
                </div>
                <button class="btn" id="startBtn">🚀 开始测试</button>
                <button class="btn btn-stop" id="stopBtn" disabled>⏹️ 停止测试</button>
            </div>

            <div class="progress" id="progress" style="display: none;">
                <div class="progress-bar" id="progressBar">0%</div>
            </div>

            <div id="testResults"></div>

            <div class="summary" id="summary">
                <h3>📊 测试总结</h3>
                <div class="stats">
                    <div class="stat">
                        <div class="number" id="totalTests">0</div>
                        <div class="label">总测试数</div>
                    </div>
                    <div class="stat">
                        <div class="number" id="passedTests">0</div>
                        <div class="label">通过</div>
                    </div>
                    <div class="stat">
                        <div class="number" id="failedTests">0</div>
                        <div class="label">失败</div>
                    </div>
                    <div class="stat">
                        <div class="number" id="successRate">0%</div>
                        <div class="label">通过率</div>
                    </div>
                </div>
                <p id="summaryText"></p>
            </div>
        </div>
    </div>

    <script>
        let shouldStop = false;

        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');

        startBtn.addEventListener('click', startTest);
        stopBtn.addEventListener('click', stopTest);

        function startTest() {
            shouldStop = false;
            stopBtn.disabled = false;
            runTests();
        }

        function stopTest() {
            shouldStop = true;
            stopBtn.disabled = true;
        }

        async function runTests() {
            const baseUrl = document.getElementById('baseUrl').value.replace(/\/$/, '');
            let testBookId = document.getElementById('testBookId').value;

            const results = { total: 0, passed: 0, failed: 0 };
            const container = document.getElementById('testResults');
            container.innerHTML = '';

            document.getElementById('progress').style.display = 'block';

            const tests = [
                {
                    name: '1. 词库列表页加载',
                    url: `${baseUrl}/admin/word-books`,
                    check: (doc) => {
                        const table = doc.querySelector('table');
                        const viewBtn = doc.querySelector('button[title="查看单词"]');
                        return { pass: !!table, message: table ? '页面加载成功' : '表格未找到' };
                    }
                },
                {
                    name: '2. API - 获取词库列表',
                    url: `${baseUrl}/api/admin/word-books?page=1&pageSize=10`,
                    isApi: true,
                    check: (data) => {
                        return { pass: data.data !== undefined, message: `返回 ${data.data?.length || 0} 条记录` };
                    }
                },
                {
                    name: '3. API - 获取章节列表',
                    url: null, // 动态生成
                    isApi: true,
                    check: (data) => {
                        return { pass: data.data !== undefined, message: `返回 ${data.data?.chapters?.length || 0} 个章节` };
                    }
                },
                {
                    name: '4. API - 获取单词列表',
                    url: null, // 动态生成
                    isApi: true,
                    check: (data) => {
                        return { pass: data.data !== undefined, message: `返回 ${data.data?.length || 0} 个单词` };
                    }
                }
            ];

            // 获取测试用单词书ID
            if (!testBookId) {
                try {
                    const response = await fetch(`${baseUrl}/api/admin/word-books?page=1&pageSize=1`);
                    const data = await response.json();
                    if (data.data && data.data.length > 0) {
                        testBookId = data.data[0].id;
                        addResult({
                            name: '0. 准备测试数据',
                            pass: true,
                            message: `找到单词书: ${data.data[0].title} (ID: ${testBookId})`
                        }, container);
                    }
                } catch (e) {
                    addResult({
                        name: '0. 准备测试数据',
                        pass: false,
                        message: '无法获取单词书，将跳过需要bookId的测试'
                    }, container);
                }
            }

            for (let i = 0; i < tests.length; i++) {
                if (shouldStop) break;

                const test = tests[i];
                results.total++;

                let url = test.url;
                if (url === null && testBookId) {
                    if (test.name.includes('章节')) {
                        url = `${baseUrl}/api/admin/word-books/${testBookId}/chapters`;
                    } else if (test.name.includes('单词')) {
                        url = `${baseUrl}/api/admin/word-books/${testBookId}/words`;
                    }
                }

                if (!url) {
                    addResult({
                        name: test.name,
                        pass: false,
                        message: '无法生成测试URL'
                    }, container);
                    results.failed++;
                    continue;
                }

                updateProgress(i + 1, tests.length);

                try {
                    let result;
                    if (test.isApi) {
                        const response = await fetch(url);
                        const data = await response.json();
                        result = test.check(data);
                    } else {
                        const response = await fetch(url);
                        const html = await response.text();
                        const parser = new DOMParser();
                        const doc = parser.parseFromString(html, 'text/html');
                        result = test.check(doc);
                    }

                    if (result.pass) {
                        results.passed++;
                    } else {
                        results.failed++;
                    }

                    addResult({
                        name: test.name,
                        pass: result.pass,
                        message: result.message
                    }, container);

                } catch (error) {
                    results.failed++;
                    addResult({
                        name: test.name,
                        pass: false,
                        message: `错误: ${error.message}`
                    }, container);
                }

                await new Promise(resolve => setTimeout(resolve, 500));
            }

            // 显示总结
            const rate = results.total > 0 ? Math.round((results.passed / results.total) * 100) : 0;
            document.getElementById('totalTests').textContent = results.total;
            document.getElementById('passedTests').textContent = results.passed;
            document.getElementById('failedTests').textContent = results.failed;
            document.getElementById('successRate').textContent = rate + '%';
            document.getElementById('summaryText').textContent =
                results.failed === 0 ? '🎉 所有测试通过！' : `⚠️ ${results.failed} 个测试失败`;

            document.getElementById('summary').classList.add('show');
            stopBtn.disabled = true;
        }

        function addResult(test, container) {
            const div = document.createElement('div');
            div.className = `test-item ${test.pass ? 'pass' : 'fail'}`;
            div.innerHTML = `
                <h4><span class="status">${test.pass ? '✓ 通过' : '✗ 失败'}</span> ${test.name}</h4>
                <p>${test.message}</p>
            `;
            container.appendChild(div);
        }

        function updateProgress(current, total) {
            const percentage = Math.round((current / total) * 100);
            document.getElementById('progressBar').style.width = percentage + '%';
            document.getElementById('progressBar').textContent = percentage + '%';
        }
    </script>
</body>
</html>
